name: Build PHP Runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'PHP Version to build'
        required: true
        default: '8.4.0'
  schedule:
    - cron: '0 0 * * 0' # Weekly rebuild

jobs:
  build-linux-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux-x64, linux-arm64, android-arm64-v8a]
    steps:
      - uses: actions/checkout@v4
      - name: Build PHP
        run: ./build/php.sh ${{ github.event.inputs.version || '8.4.0' }} ${{ matrix.target }}
      - name: Compress
        run: ./scripts/compress.sh php ${{ github.event.inputs.version || '8.4.0' }} ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.target }}
          path: runtime/

  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [macos-x64, macos-arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Build PHP
        run: ./build/php.sh ${{ github.event.inputs.version || '8.4.0' }} ${{ matrix.target }}
      - name: Compress
        run: ./scripts/compress.sh php ${{ github.event.inputs.version || '8.4.0' }} ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.target }}
          path: runtime/

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [windows-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Build PHP
        run: bash ./build/php.sh ${{ github.event.inputs.version || '8.4.0' }} ${{ matrix.target }}
      - name: Compress
        run: bash ./scripts/compress.sh php ${{ github.event.inputs.version || '8.4.0' }} ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.target }}
          path: runtime/

  release:
    needs: [build-linux-android, build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: runtime/
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: php-v${{ github.event.inputs.version || '8.4.0' }}
          name: PHP v${{ github.event.inputs.version || '8.4.0' }}
          files: runtime/*
          make_latest: true
