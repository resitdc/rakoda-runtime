name: Build Node Runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Node.js Version to build'
        required: true
        default: '22.0.0'
  schedule:
    - cron: '0 0 * * 0' # Weekly rebuild

jobs:
  build-linux-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux-x64, linux-arm64, android-arm64-v8a]
    steps:
      - uses: actions/checkout@v4
      - name: Build Node.js
        run: ./build/node.sh ${{ github.event.inputs.version || '22.0.0' }} ${{ matrix.target }}
      - name: Compress
        run: ./scripts/compress.sh node ${{ github.event.inputs.version || '22.0.0' }} ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: runtime/

  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [macos-x64, macos-arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Build Node.js
        run: ./build/node.sh ${{ github.event.inputs.version || '22.0.0' }} ${{ matrix.target }}
      - name: Compress
        run: ./scripts/compress.sh node ${{ github.event.inputs.version || '22.0.0' }} ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: runtime/

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [windows-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Build Node.js
        run: bash ./build/node.sh ${{ github.event.inputs.version || '22.0.0' }} ${{ matrix.target }}
      - name: Compress
        run: bash ./scripts/compress.sh node ${{ github.event.inputs.version || '22.0.0' }} ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: runtime/
