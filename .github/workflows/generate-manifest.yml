name: Generate Manifest

on:
  workflow_run:
    workflows: ["Build PHP Runtime", "Build Node Runtime"]
    types:
      - completed
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate Manifest
        run: node scripts/generate_manifest.js
      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add manifest/runtime.json
          git commit -m "Update runtime.json" || echo "No changes to commit"
          git push
